{% extends "base.html" %}
{% block title %}Account Settings — Duo Expense{% endblock %}
{% block extra_css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/dashboard.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/sidebar.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">
{% endblock %}

{% block content %}
{% include "_sidebar.html" %}

<div class="app-shell" style="max-width:560px;">
  <div class="page-head reveal">
    <h1>Account Settings</h1>
    <p>{{ current_user.email }}</p>
  </div>

  <div class="glass card reveal" style="padding:24px 28px; margin-top:16px;">
    <h3 style="font-size:14.5px; margin-bottom:14px;">Username</h3>
    <form method="POST">
      <input type="hidden" name="action" value="update_username">
      <div class="field">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" value="{{ current_user.username }}" required minlength="3">
      </div>
      <button type="submit" class="btn btn-primary btn-sm">Save Username</button>
    </form>
  </div>

  <div class="glass card reveal" style="padding:24px 28px; margin-top:16px;">
    <h3 style="font-size:14.5px; margin-bottom:14px;">Change Password</h3>
    <form method="POST">
      <input type="hidden" name="action" value="update_password">
      <div class="field">
        <label for="current_password">Current password</label>
        <input type="password" id="current_password" name="current_password" required>
      </div>
      <div class="field">
        <label for="new_password">New password</label>
        <input type="password" id="new_password" name="new_password" placeholder="At least 8 characters" required minlength="8" data-password-strength>
        <div class="strength-track"><div class="strength-meter"></div></div>
        <span class="strength-label"></span>
      </div>
      <div class="field">
        <label for="confirm_password">Confirm new password</label>
        <input type="password" id="confirm_password" name="confirm_password" required minlength="8">
      </div>
      <button type="submit" class="btn btn-primary btn-sm">Update Password</button>
    </form>
  </div>
</div>
{% endblock %}

{% block extra_js %}
<script src="{{ url_for('static', filename='js/sidebar.js') }}"></script>
{% endblock %}
