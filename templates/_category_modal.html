<div class="modal-overlay" id="category-modal-overlay">
  <div class="modal-box glass-strong">
    <button class="modal-close" onclick="closeCategoryModal()">✕</button>
    <h3 id="category-modal-title">Add Category</h3>
    <p class="modal-sub">New categories appear on your expense wheel instantly.</p>

    <form id="category-form">
      <input type="hidden" id="category-id" value="">
      <div class="field">
        <label for="category-name">Category name</label>
        <input type="text" id="category-name" placeholder="e.g. Subscriptions" required>
      </div>
      <div class="field">
        <label for="category-budget">Monthly budget (optional)</label>
        <input type="number" id="category-budget" min="0" step="1" placeholder="0">
      </div>
      <div class="field">
        <label>Icon</label>
        <div class="icon-swatches" id="icon-swatches"></div>
      </div>
      <div class="field">
        <label>Color</label>
        <div class="color-swatches" id="color-swatches"></div>
      </div>
      <button type="submit" class="btn btn-primary btn-block mt-16">Save Category</button>
    </form>
  </div>
</div>
