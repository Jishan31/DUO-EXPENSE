{% extends "base.html" %}
{% block title %}Contact Us — Duo Expense{% endblock %}
{% block extra_css %}<link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">{% endblock %}

{% block content %}
<div class="auth-shell">
  <a href="{{ url_for('auditor.auditor_dashboard') if current_user.is_authenticated and current_user.role == 'auditor' else (url_for('main.dashboard') if current_user.is_authenticated else url_for('main.landing')) }}" class="auth-back">← Back</a>

  <div class="auth-card glass-strong">
    <div class="auth-orb">💬</div>
    <h1>Contact &amp; Support</h1>
    <p class="auth-sub">Question, bug report, or need help with something? Leave your details and we'll get back to you.</p>

    <form method="POST" action="{{ url_for('main.contact') }}">
      <div class="field">
        <label for="name">Name</label>
        <input type="text" id="name" name="name" value="{{ prefill_name }}" required>
      </div>
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" value="{{ prefill_email }}" required>
      </div>
      <div class="field">
        <label for="phone">Phone (optional)</label>
        <input type="tel" id="phone" name="phone">
      </div>
      <div class="field">
        <label for="message">Message</label>
        <textarea id="message" name="message" rows="5" placeholder="What can we help with?" required></textarea>
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%; margin-top:6px;">Send Message</button>
    </form>
  </div>
</div>
{% endblock %}
