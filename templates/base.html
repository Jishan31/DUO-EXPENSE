<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#7C5CBF" />
  <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}" />
  <link rel="apple-touch-icon" href="{{ url_for('static', filename='images/apple-touch-icon.png') }}" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Duo Expense" />
  <title>{% block title %}Duo Expense — Expense Tracker{% endblock %}</title>
  <script>
    // Sets the theme BEFORE any CSS/content renders, so there is no flash
    // of the wrong theme on page load or navigation. Deliberately inline
    // and synchronous — a deferred/external script would run too late.
    (function () {
      var valid = ["light", "dark", "ocean", "sunset"];
      var saved = localStorage.getItem("duo-theme");
      document.documentElement.setAttribute("data-theme", valid.indexOf(saved) !== -1 ? saved : "light");
    })();
  </script>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
  {% block extra_css %}{% endblock %}
</head>
<body>
  <div class="aurora-bg">
    <div class="blob"></div><div class="blob"></div><div class="blob"></div>
    <div class="float-symbols" id="float-symbols"></div>
  </div>

  {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
      <div class="flash-stack">
        {% for category, message in messages %}
          <div class="flash flash-{{ category if category != 'message' else 'info' }}">{{ message }}</div>
        {% endfor %}
      </div>
    {% endif %}
  {% endwith %}

  {% block content %}{% endblock %}

  <script src="{{ url_for('static', filename='js/main.js') }}"></script>
  <script src="{{ url_for('static', filename='js/float-bg.js') }}"></script>
  <script src="{{ url_for('static', filename='js/page-transitions.js') }}"></script>
  <script src="{{ url_for('static', filename='js/tilt.js') }}"></script>
  {% block extra_js %}{% endblock %}
</body>
</html>
